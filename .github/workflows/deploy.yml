name: Comprobar y publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Quien publica en lindairiane.com es Cloudflare (Workers Builds, conectado
  # al repo). Esto genera el sitio y revisa que no haya nada roto: si falla,
  # el fallo se ve aquí y no en la web.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # El proyecto no tiene dependencias: solo Node y los ficheros del repo.
      - name: Generar el sitio
        run: node build.js

      - name: Comprobar enlaces e imágenes
        run: node tools/check.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  # Copia de repuesto en GitHub Pages, útil mientras el dominio no apunte
  # todavía a Cloudflare. Se puede quitar cuando esté la web en marcha.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
